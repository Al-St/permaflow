raw_data: data/raw/AllData.csv
base_stations: data/raw/base_stations.csv
devices: data/raw/devices.csv
output_dir: data/intermediate
max_valid_date: "2030-01-01"   # отсечение будущих дат (сбой часов прибора)

# ---- этап 1: кластеризация и регуляризация ----------------------------------

clustering:
  accuracy_split_m: 1000      # порог класса точности координат (GNSS/LBS), м
  eps_rad_gnss: 9.3e-06       # GNSS: ~60 м (погрешность 30 м)
  eps_rad_lbs: 0.003          # LBS (вышки): ~19 км (погрешность 85 км)
  eps_t_days: 30              # временной радиус ST-DBSCAN, сутки
  min_samples_gnss: 120       # MinPts по умолчанию; индивидуальный - в devices
  min_samples_lbs: 13
  max_attach_km: 50           # дальше кластер не привязывается к БПН
  zone:
    min_lat: 65.0
    min_lon: 50.0
    max_lat: 90.0
    max_lon: 360.0

exclusions:
  - imei: "543795"
    reason: ""
  - imei: "300234069809470"
    start: "2024-09-19"
    reason: ""

regularization:
  default_freq: 6h            # единая сетка и сроки для всех скважин
  device_warmup_hours: 12.0   # переходный процесс прибора отбрасывается

# ---- этап 2: фильтрация выбросов и восстановление пропусков -----------------

# Вход этапа 2; null = output_dir/RES_clustered.csv (продукт этапа 1).
filter_input: null

outliers:
  window_days: 30       # ширина скользящего окна, сутки
  alpha: 0.01           # уровень квантильного коридора Лапласа
  wavelet: bior3.1
  wavelet_level: 1
  gap_fill_limit: 12
  observation_hours: null
  min_deviation: 0.1    # нижний порог "грубого сбоя" невязки, °C (точность датчиков)
  level_floor_c: 25.0   # пол порога по уровню, °C (серийные сбои/насыщение датчика)
  example_series:
    - well: "TB-24691-01"   # М-2 Делянкир: сбои до ±41 °C на 0.0 м
      depths: [0.0, 0.4, 0.6, 1.0, 1.6]
    - well: "TB-24959-01"   # ОГМС Якутск: смена прибора 18.12.2024 (5-6 м)
      depths: [0.0, 0.4, 1.6, 5.0, 6.0, 10.0]
    - well: "TB-23330-01"   # М-2 Салехард M-II
      depths: [0.0, 0.4, 1.6, 10.0]
    - well: "TB-23339-01"   # М-2 Полуй: пропуски телеметрии
      depths: [0.0, 0.4, 1.6, 10.0]
    - well: "TB-36248-02"   # АМС Актру (скважина 2)
      depths: [0.0, 0.4, 1.6, 10.0]
    - well: "TB-20107-01"   # ГМО СП Баренцбург
      depths: [0.0, 0.4, 1.6, 10.0]
    - well: "TB-23058-01"   # М-2 Антипаюта: с глубинами 5-6 м для контроля ступеней
      depths: [0.0, 0.4, 1.6, 5.0, 6.0, 10.0]

# Выравнивание сдвигов уровня между поколениями приборов на глубоких
# горизонтах (ступень при смене термокосы - приборный артефакт):
# подтверждается только на сезон-свободных горизонтах (>= 12 м, где
# годовой ход < порога), единая калибровочная константа на все глубины.
level_shift:
  depths_from_m: 5.0
  min_step_c: 0.2
  window_days: 14          # минимальный интервал между выравниваемыми ступенями
  max_shifts: 5
  season_free_from_m: 12.0

# Восстановление пропусков после фильтрации: лимит зависит от масштаба
# изменчивости ряда на глубине (лимиты — интервалы сетки 6 ч):
#   суточный ход (<= 1 м)     — до 2 интервалов (12 ч), линейно по времени;
#   годовой ход (1–12 м)      — до 40 интервалов (10 суток), Akima;
#   сезон-свободные (>= 12 м) — до 120 интервалов (30 суток), мост по
#                               средним у границ пропуска.
# Пропуски длиннее лимита своего класса остаются NaN.
gap_fill:
  diurnal_upto_m: 1.0
  diurnal_limit: 2
  seasonal_limit: 40
  season_free_from_m: 12.0
  deep_limit: 120
